name: Submission policy

# Refuses a submission before human review when the submitting account is on
# the blocked list in .github/submission-policy.json.
#
# pull_request_target with the checkout pinned to the base commit, so the policy
# file and checker always come from main: a fork cannot edit them, and the
# pull request's own code is never checked out or executed here.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  submission-policy:
    name: Refuse blocked accounts
    if: ${{ github.repository == 'zhu1090093659/dsh-community-plugins' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Account policy
        id: policy
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          : > close-reason.txt
          set +e
          node scripts/submission-policy.mjs --login "$PR_AUTHOR" > decision.txt 2>&1
          code=$?
          set -e
          case "$code" in
            0) ;;
            3) cat decision.txt >> close-reason.txt; echo "close=true" >> "$GITHUB_OUTPUT" ;;
            *) cat decision.txt >&2; exit "$code" ;;
          esac

      - name: Close the submission
        if: steps.policy.outputs.close == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "submission-policy: pull request is $state; nothing to close"
            exit 0
          fi
          { cat close-reason.txt; echo; cat .github/submission-policy-notice.md; } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
          gh pr close "$PR_NUMBER"
